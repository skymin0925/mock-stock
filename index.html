<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모의 주식 투자</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <span class="logo">📈 모의 주식 투자</span>
</header>

<main style="max-width:420px">
  <div class="card">
    <div class="tabs">
      <button id="tab-login" class="active" onclick="showTab('login')">로그인</button>
      <button id="tab-signup" onclick="showTab('signup')">회원가입</button>
    </div>

    <!-- 로그인 -->
    <form id="form-login" onsubmit="doLogin(event)">
      <label>이메일</label>
      <input type="email" id="login-email" required>
      <label>비밀번호</label>
      <input type="password" id="login-password" required>
      <button type="submit">로그인</button>
    </form>

    <!-- 회원가입 -->
    <form id="form-signup" style="display:none" onsubmit="doSignup(event)">
      <label>닉네임 (랭킹에 표시됩니다)</label>
      <input type="text" id="signup-nickname" required maxlength="12">
      <label>이메일</label>
      <input type="email" id="signup-email" required>
      <label>비밀번호 (6자 이상)</label>
      <input type="password" id="signup-password" required minlength="6">
      <button type="submit">가입하고 1,000만원 받기</button>
    </form>

    <div id="msg" class="msg"></div>
    <p class="hint">가입하면 가상 현금 1,000만원이 지급됩니다. 실제 돈은 사용되지 않습니다.</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
// 이미 로그인한 상태면 바로 시세 화면으로
currentUser().then(user => { if (user) location.href = 'market.html'; });

function showTab(name) {
  const isLogin = name === 'login';
  document.getElementById('form-login').style.display = isLogin ? '' : 'none';
  document.getElementById('form-signup').style.display = isLogin ? 'none' : '';
  document.getElementById('tab-login').classList.toggle('active', isLogin);
  document.getElementById('tab-signup').classList.toggle('active', !isLogin);
  setMsg('');
}

function setMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (type || '');
}

async function doLogin(e) {
  e.preventDefault();
  setMsg('로그인 중...');
  const { error } = await db.auth.signInWithPassword({
    email: document.getElementById('login-email').value.trim(),
    password: document.getElementById('login-password').value
  });
  if (error) { setMsg('로그인 실패: ' + error.message, 'error'); return; }
  location.href = 'market.html';
}

async function doSignup(e) {
  e.preventDefault();
  setMsg('가입 중...');
  const nickname = document.getElementById('signup-nickname').value.trim();
  const { error } = await db.auth.signUp({
    email: document.getElementById('signup-email').value.trim(),
    password: document.getElementById('signup-password').value,
    options: { data: { nickname: nickname } }
  });
  if (error) { setMsg('가입 실패: ' + error.message, 'error'); return; }

  // 이메일 인증을 껐다면 바로 로그인 상태가 됩니다
  const user = await currentUser();
  if (user) { location.href = 'market.html'; }
  else { setMsg('가입 완료! 이메일의 인증 링크를 확인한 뒤 로그인하세요.', 'ok'); }
}
</script>
</body>
</html>
